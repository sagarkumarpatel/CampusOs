version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusos-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # IMPORTANT: Do not hardcode passwords here. 
      # You can replace this with a variable like ${DOCKER_DATABASE_URL} and add it to your .env file
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://postgres:YOUR_PASSWORD_HERE@host.docker.internal:5432/campusos?schema=public}
    extra_hosts:
      - "host.docker.internal:host-gateway"
